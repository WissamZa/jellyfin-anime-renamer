[project]
name = "jellyfin-anime-renamer"
version = "5.7.0"
description = "Rename & organise anime episodes for Jellyfin. Hooks into qBittorrent for fully automatic post-download processing."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["jellyfin", "anime", "renamer", "tmdb", "anilist", "kitsu", "qbittorrent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "pykakasi>=2.3.0",
    "urllib3>=2.0.0",
]

[project.urls]
Homepage      = "https://github.com/YOUR_USERNAME/jellyfin-anime-renamer"
Documentation = "https://github.com/YOUR_USERNAME/jellyfin-anime-renamer#readme"
Issues        = "https://github.com/YOUR_USERNAME/jellyfin-anime-renamer/issues"

[project.scripts]
rename  = "jellyfin_renamer:main"
qbhook  = "qbit_hook:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "renamer",
    "jellyfin_renamer.py",
    "qbit_hook.py",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["renamer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.coverage.run]
source  = ["renamer"]
omit    = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_empty   = true

[tool.pyright]
pythonVersion            = "3.11"
typeCheckingMode         = "standard"
reportMissingImports     = true
reportMissingTypeStubs   = false
