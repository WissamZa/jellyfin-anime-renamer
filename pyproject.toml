[project]
name = "jellyfin-anime-renamer"
version = "5.0.0"
description = "Rename & organise anime for Jellyfin. Hooks into qBittorrent for fully automatic post-download processing."
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "pykakasi>=2.3.0",
]

[project.scripts]
rename  = "jellyfin_renamer:main"
qbhook  = "qbit_hook:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "renamer",
    "jellyfin_renamer.py",
    "qbit_hook.py",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pyright>=1.1.0",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
