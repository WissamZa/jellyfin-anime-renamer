[project]
name = "jellyfin-anime-renamer"
version = "2.0.0"
description = "Rename anime episodes to Jellyfin-compatible SxxExx format using TMDB and AniList"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
rename = "jellyfin_renamer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jellyfin_renamer.py"]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pyright>=1.1.0",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
